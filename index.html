<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色档案创作工具 Pro V6.0</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --m-yellow: #FFF9E3;
            --m-green: #E2F5D6;
            --m-dark-green: #A8D5BA;
            --m-pink: #FFD1DC;
            --text: #556B2F;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--m-yellow); color: #333; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 顶部导航 */
        header { width: 100%; max-width: 1400px; display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: var(--text); }
        .nav-btns { display: flex; gap: 10px; }

        /* 主体布局 */
        main { width: 100%; max-width: 1400px; display: grid; grid-template-columns: 580px 1fr; gap: 20px; align-items: start; }

        /* 编辑器侧边栏 */
        .editor-side {
            background: white; border-radius: 20px; padding: 25px;
            border: 5px solid var(--m-green); height: 90vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .section-box { margin-bottom: 25px; padding: 15px; background: #fafafa; border-radius: 12px; border: 1px solid #eee; }
        .section-box h3 { margin: 0 0 15px 0; font-size: 16px; color: var(--text); border-bottom: 2px solid var(--m-dark-green); padding-bottom: 5px; }

        /* 输入项 */
        .field-item { margin-bottom: 12px; }
        .label-wrap { display: block; font-size: 11px; color: #888; font-weight: bold; margin-bottom: 4px; }
        .label-zh { color: #aaa; font-weight: normal; margin-left: 6px; }
        
        input, textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; box-sizing: border-box; background: #fff;
        }
        input:focus { border-color: var(--m-dark-green); outline: none; }

        /* 动态列表（用于数组字段） */
        .dynamic-list { display: flex; flex-direction: column; gap: 6px; }
        .list-row { display: flex; gap: 5px; align-items: center; }
        .btn-sm { padding: 4px 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 10px; }
        .btn-add { background: var(--m-dark-green); color: white; width: 100%; margin-top: 5px; }
        .btn-del { background: #ff7675; color: white; }

        /* 右侧预览区 */
        .preview-side { position: sticky; top: 20px; height: 90vh; display: flex; flex-direction: column; }
        .style-header { background: white; padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #render-window { flex: 1; overflow-y: auto; background: #888; border-radius: 15px; display: flex; justify-content: center; padding: 40px 0; }
        
        /* 预览画布 */
        #profile-canvas { width: 850px; background: white; min-height: 1200px; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.3); }

        /* ----- 风格设计 ----- */

        /* 风格1: 通缉令 (Wanted) */
        .style-wanted { background: #e6ccab; color: #3e2723; padding: 60px; border: 25px solid #3e2723; text-align: center; font-family: 'Impact', fantasy; }
        .style-wanted .header-text { font-size: 120px; letter-spacing: 15px; margin: 0; }
        .style-wanted .avatar-frame { width: 450px; height: 450px; border: 8px solid #3e2723; margin: 20px auto; filter: sepia(0.6) contrast(1.2); }
        .style-wanted .reward { font-size: 60px; border-top: 6px solid #3e2723; border-bottom: 6px solid #3e2723; margin: 20px 0; }
        .style-wanted .content-text { font-family: serif; text-align: left; font-size: 16px; margin-top: 30px; font-weight: bold; }

        /* 风格2: 档案 (Macaron) */
        .style-archive { background: var(--m-yellow); padding: 50px; color: var(--text); }
        .style-archive .inner-card { background: white; border-radius: 30px; padding: 40px; border: 10px solid var(--m-green); }
        .style-archive h2 { background: var(--m-dark-green); color: white; display: inline-block; padding: 5px 20px; border-radius: 50px; }

        /* 风格3: 证件 (ID Card) */
        .style-id { background: #1a1a1a; color: #00ffcc; padding: 40px; font-family: monospace; }
        .style-id .id-line { border-bottom: 1px solid #333; padding: 10px 0; }
        .style-id .avatar-frame { width: 200px; height: 200px; border: 2px solid #00ffcc; float: right; }

        /* 风格4: 手账 (Journal) */
        .style-journal { background: #fff; padding: 50px; border: 2px solid var(--m-pink); }
        .style-journal .mask-tape { width: 120px; height: 40px; background: rgba(255, 209, 220, 0.5); position: absolute; transform: rotate(-5deg); top: 20px; }

        /* 风格5: 简约网格 (Bauhaus) */
        .style-bauhaus { background: #fff; padding: 0; color: #000; display: grid; grid-template-columns: repeat(4, 1fr); }
        .style-bauhaus .cell { border: 1px solid #000; padding: 20px; }

        /* 导入弹窗 */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; }
        .modal-inner { background:white; padding:30px; border-radius:20px; width:700px; max-width:90%; }

        .btn { padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-p { background: var(--m-dark-green); color: white; }
    </style>
</head>
<body>

<header>
    <div class="logo">🧸 RoleProfile Creator Pro</div>
    <div class="nav-btns">
        <button class="btn btn-p" onclick="openImport()">💡 导入内容 (YAML)</button>
        <button class="btn btn-p" style="background:#4A90E2" onclick="exportPureYAML()">📤 导出纯英文文本</button>
        <button class="btn btn-p" style="background:var(--m-pink); color:#B36B7C" onclick="downloadPNG()">📸 保存为图片</button>
    </div>
</header>

<main>
    <!-- 左侧编辑器 -->
    <aside class="editor-side" id="form-root">
        <!-- 头像 -->
        <div class="section-box">
            <h3>Image 形象上传</h3>
            <input type="file" accept="image/*" onchange="loadAvatar(this)">
        </div>

        <!-- char_name -->
        <div class="section-box">
            <h3>char_name 核心信息</h3>
            <div class="field-item">
                <label class="label-wrap">Chinese name <span class="label-zh">中文名</span></label>
                <input type="text" data-path="char_name.Chinese_name">
            </div>
            <div class="field-item">
                <label class="label-wrap">Nickname <span class="label-zh">昵称</span></label>
                <input type="text" data-path="char_name.Nickname">
            </div>
            <div style="display:flex; gap:10px">
                <input type="text" data-path="char_name.age" placeholder="age 年龄">
                <input type="text" data-path="char_name.gender" placeholder="gender 性别">
                <input type="text" data-path="char_name.height" placeholder="height 身高">
            </div>
            <div class="field-item" style="margin-top:10px">
                <label class="label-wrap">identity <span class="label-zh">身份标签</span></label>
                <div id="list-identity" class="dynamic-list"></div>
                <button class="btn-sm btn-add" onclick="addItem('identity')">+ Add Identity</button>
            </div>
        </div>

        <!-- background_story -->
        <div class="section-box">
            <h3>background_story 背景故事</h3>
            <div class="field-item"><label class="label-wrap">童年(0-12岁)</label><textarea data-path="background_story.童年"></textarea></div>
            <div class="field-item"><label class="label-wrap">少年(13-18岁)</label><textarea data-path="background_story.少年"></textarea></div>
            <div class="field-item"><label class="label-wrap">青年(19-35岁)</label><textarea data-path="background_story.青年"></textarea></div>
            <div class="field-item"><label class="label-wrap">中年(35-至今)</label><textarea data-path="background_story.中年"></textarea></div>
            <div class="field-item"><label class="label-wrap">现状</label><textarea data-path="background_story.现状"></textarea></div>
        </div>

        <!-- social_status -->
        <div class="section-box">
            <h3>social_status 社会地位</h3>
            <div id="list-social_status" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addItem('social_status')">+ Add Social Status</button>
        </div>

        <!-- appearance -->
        <div class="section-box">
            <h3>appearance 外貌特征</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                <input type="text" data-path="appearance.hair" placeholder="hair 发型">
                <input type="text" data-path="appearance.eyes" placeholder="eyes 眼睛">
                <input type="text" data-path="appearance.skin" placeholder="skin 皮肤">
                <input type="text" data-path="appearance.face_style" placeholder="face_style 脸型">
            </div>
            <div style="margin-top:10px">
                <label class="label-wrap">build <span class="label-zh">身材/体型标签</span></label>
                <div id="list-build" class="dynamic-list"></div>
                <button class="btn-sm btn-add" onclick="addItem('build')">+ Add Build Tag</button>
            </div>
        </div>

        <!-- attire -->
        <div class="section-box">
            <h3>attire 衣着</h3>
            <input type="text" data-path="attire.business_formal" placeholder="business_formal 商务正装" class="field-item">
            <input type="text" data-path="attire.business_casual" placeholder="business_casual 商务休闲" class="field-item">
            <input type="text" data-path="attire.casual_wear" placeholder="casual_wear 日常便装" class="field-item">
            <input type="text" data-path="attire.home_wear" placeholder="home_wear 居家穿着" class="field-item">
        </div>

        <!-- personality -->
        <div class="section-box">
            <h3>personality 性格</h3>
            <input type="text" data-path="archetype" placeholder="archetype 角色类型" class="field-item">
            <label class="label-wrap">core_traits <span class="label-zh">核心性格:描述</span></label>
            <div id="list-core_traits" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addPair('core_traits')">+ Add Core Trait</button>
            <label class="label-wrap" style="margin-top:10px">romantic_traits <span class="label-zh">情感性格:描述</span></label>
            <div id="list-romantic_traits" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addPair('romantic_traits')">+ Add Romantic Trait</button>
        </div>

        <!-- behaviors -->
        <div class="section-box">
            <h3>behaviors 行为习惯</h3>
            <label class="label-wrap">lifestyle_behaviors <span class="label-zh">生活习惯</span></label>
            <div id="list-lifestyle_behaviors" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addItem('lifestyle_behaviors')">+ Add Lifestyle</button>
            <label class="label-wrap" style="margin-top:10px">work_behaviors <span class="label-zh">工作习惯</span></label>
            <div id="list-work_behaviors" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addItem('work_behaviors')">+ Add Work Behavior</button>
            <div style="display:flex; gap:10px; margin-top:10px">
                <input type="text" data-path="emotional_behaviors.angry" placeholder="angry 愤怒反应">
                <input type="text" data-path="emotional_behaviors.happy" placeholder="happy 开心反应">
            </div>
        </div>

        <!-- 缺失板块补充 -->
        <div class="section-box">
            <h3>Others 其他特征</h3>
            <label class="label-wrap">goals <span class="label-zh">目标</span></label>
            <div id="list-goals" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addItem('goals')">+ Add Goal</button>
            <hr>
            <label class="label-wrap">relationships <span class="label-zh">人际关系 (姓名:关系:描述)</span></label>
            <div id="list-relationships" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addRel()">+ Add Relationship</button>
            <hr>
            <label class="label-wrap">shared_history_with_user <span class="label-zh">与用户共同经历</span></label>
            <div id="list-history" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addItem('history')">+ Add History</button>
            <hr>
            <div class="field-item"><label class="label-wrap">weakness 缺点</label><input type="text" data-path="weakness" placeholder="逗号隔开"></div>
            <div class="field-item"><label class="label-wrap">likes 喜欢</label><input type="text" data-path="likes" placeholder="逗号隔开"></div>
            <div class="field-item"><label class="label-wrap">dislikes 厌恶</label><input type="text" data-path="dislikes" placeholder="逗号隔开"></div>
        </div>

        <!-- skills -->
        <div class="section-box">
            <h3>skills 技能 (嵌套格式)</h3>
            <div class="field-item"><label class="label-wrap">工作技能</label><input type="text" id="skill-work" placeholder='["A", "B"] 格式'></div>
            <div class="field-item"><label class="label-wrap">生活技能</label><input type="text" id="skill-life"></div>
            <div class="field-item"><label class="label-wrap">爱好技能</label><input type="text" id="skill-hobby"></div>
        </div>

        <!-- NSFW -->
        <div class="section-box" style="background:#fff0f0">
            <h3>NSFW_information 隐私信息</h3>
            <input type="text" data-path="NSFW.experiences" placeholder="experiences 性经历" class="field-item">
            <input type="text" data-path="NSFW.orientation" placeholder="sexual_orientation 性取向" class="field-item">
            <input type="text" data-path="NSFW.role" placeholder="sexual_role 性角色倾向" class="field-item">
            <label class="label-wrap">sexual_habits 习惯性癖好</label>
            <div id="list-habits" class="dynamic-list"></div>
            <button class="btn-sm btn-add" onclick="addItem('habits')">+ Add Habit</button>
            <input type="text" data-path="NSFW.kinks" placeholder="Kinks 性癖好" class="field-item" style="margin-top:10px">
            <input type="text" data-path="NSFW.limits" placeholder="Limits 不接受底线" class="field-item">
        </div>

        <button class="btn btn-p" style="width:100%; font-size:18px" onclick="refreshRender()">立即渲染生成 ✨</button>
    </aside>

    <!-- 右侧渲染区 -->
    <section class="preview-side">
        <div class="style-header">
            <span>风格：</span>
            <select id="style-select" onchange="refreshRender()">
                <option value="style-archive">档案风 (Archive)</option>
                <option value="style-wanted">通缉令风 (Wanted)</option>
                <option value="style-id">证件风 (Cyber ID)</option>
                <option value="style-journal">手账风 (Journal)</option>
                <option value="style-bauhaus">简约网格 (Bauhaus)</option>
            </select>
        </div>
        <div id="render-window">
            <div id="profile-canvas">
                <!-- 内容动态生成 -->
            </div>
        </div>
    </section>
</main>

<!-- 导入弹窗 -->
<div id="modal-import" class="modal">
    <div class="modal-inner">
        <h3>粘贴 YAML 档案</h3>
        <textarea id="import-area" style="width:100%; height:400px; font-family:monospace;"></textarea>
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:flex-end">
            <button class="btn" onclick="closeImport()">取消</button>
            <button class="btn btn-p" onclick="doImport()">执行精准导入</button>
        </div>
    </div>
</div>

<script>
    let avatarBase64 = "";

    // --- 基础组件逻辑 ---
    function addItem(id, val = "") {
        const wrap = document.getElementById('list-' + id);
        const div = document.createElement('div');
        div.className = 'list-row';
        div.innerHTML = `<input type="text" class="list-input" value="${val}"><button class="btn-sm btn-del" onclick="this.parentElement.remove()">X</button>`;
        wrap.appendChild(div);
    }

    function addPair(id, k = "", v = "") {
        const wrap = document.getElementById('list-' + id);
        const div = document.createElement('div');
        div.className = 'list-row';
        div.innerHTML = `<input type="text" class="k" style="width:30%" value="${k}"><input type="text" class="v" style="width:65%" value="${v}"><button class="btn-sm btn-del" onclick="this.parentElement.remove()">X</button>`;
        wrap.appendChild(div);
    }

    function addRel(n="", r="", d="") {
        const wrap = document.getElementById('list-relationships');
        const div = document.createElement('div');
        div.className = 'list-row';
        div.innerHTML = `<input type="text" class="r-n" placeholder="名" style="width:25%" value="${n}"><input type="text" class="r-r" placeholder="关系" style="width:25%" value="${r}"><input type="text" class="r-d" placeholder="描述" style="width:45%" value="${d}"><button class="btn-sm btn-del" onclick="this.parentElement.remove()">X</button>`;
        wrap.appendChild(div);
    }

    function loadAvatar(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { avatarBase64 = e.target.result; refreshRender(); };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // --- 精准解析引擎 ---
    function doImport() {
        const raw = document.getElementById('import-area').value;
        const lines = raw.split('\n');
        
        // 清空列表
        document.querySelectorAll('.dynamic-list').forEach(l => l.innerHTML = "");

        let currentSection = "";
        
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            // 匹配简单键值对
            const kvMatch = trimmed.match(/^([^:-]+):\s*(.*)$/);
            if (kvMatch && !trimmed.startsWith('-')) {
                const k = kvMatch[1].trim();
                const v = kvMatch[2].trim().replace(/^["']|["']$/g, '');
                
                // 路径映射填表
                const field = document.querySelector(`[data-path$=".${k}"], [data-path="${k}"]`);
                if (field) field.value = v;
                currentSection = k;
            }

            // 匹配列表项
            if (trimmed.startsWith('-')) {
                const val = trimmed.substring(1).trim().replace(/^["']|["']$/g, '');
                
                // 处理技能嵌套格式: - 工作: ["A", "B"]
                if (val.includes('工作:')) document.getElementById('skill-work').value = val.match(/\[(.*?)\]/)[0];
                if (val.includes('生活:')) document.getElementById('skill-life').value = val.match(/\[(.*?)\]/)[0];
                if (val.includes('爱好:')) document.getElementById('skill-hobby').value = val.match(/\[(.*?)\]/)[0];

                // 其它列表
                if (currentSection === "identity") addItem('identity', val);
                if (currentSection === "social_status") addItem('social_status', val);
                if (currentSection === "build") addItem('build', val);
                if (currentSection === "lifestyle_behaviors") addItem('lifestyle_behaviors', val);
                if (currentSection === "work_behaviors") addItem('work_behaviors', val);
                if (currentSection === "goals") addItem('goals', val);
                if (currentSection === "shared_history_with_user") addItem('history', val);
                if (currentSection === "sexual_habits") addItem('habits', val);

                // 处理人际关系对象列表
                if (trimmed.includes('name:')) {
                    const n = trimmed.match(/name:\s*(.*)/)[1].replace(/,$/, "").trim();
                    addRel(n, "", "");
                }
            }
        });
        
        closeImport();
        refreshRender();
    }

    // --- 导出逻辑 ---
    function exportPureYAML() {
        const d = collectData();
        const yaml = `char_name:
  Chinese name: "${d.base.Chinese_name}"
  Nickname: "${d.base.Nickname}"
  age: "${d.base.age}"
  gender: "${d.base.gender}"
  height: "${d.base.height}"
  identity:
${d.lists.identity.map(i => `    - "${i}"`).join('\n')}
background_story:
  童年(0-12岁): "${d.base.childhood}"
  少年(13-18岁): "${d.base.youth}"
  青年(19-35岁): "${d.base.young}"
  中年(35-至今): "${d.base.middle}"
  现状: "${d.base.status}"
social_status:
${d.lists.social_status.map(i => `    - "${i}"`).join('\n')}
appearance:
  hair: "${d.base.hair}"
  eyes: "${d.base.eyes}"
  skin: "${d.base.skin}"
  face_style: "${d.base.face_style}"
  build:
${d.lists.build.map(i => `    - "${i}"`).join('\n')}
attire:
  business_formal: "${d.base.formal}"
  business_casual: "${d.base.casual}"
  casual_wear: "${d.base.casual_wear}"
  home_wear: "${d.base.home}"
archetype: "${d.base.archetype}"
personality:
  core_traits:
${d.pairs.core.map(p => `    - ${p.k}: "${p.v}"`).join('\n')}
  romantic_traits:
${d.pairs.romantic.map(p => `    - ${p.k}: "${p.v}"`).join('\n')}
lifestyle_behaviors:
${d.lists.lifestyle.map(i => `    - "${i}"`).join('\n')}
work_behaviors:
${d.lists.work.map(i => `    - "${i}"`).join('\n')}
emotional_behaviors:
  angry: "${d.base.angry}"
  happy: "${d.base.happy}"
goals:
${d.lists.goals.map(i => `    - "${i}"`).join('\n')}
relationships:
${d.rels.map(r => `    - name: "${r.n}"\n      relationship: "${r.r}"\n      description: "${r.d}"`).join('\n')}
shared_history_with_user:
${d.lists.history.map(i => `    - "${i}"`).join('\n')}
weakness: ["${d.base.weakness}"]
likes: ["${d.base.likes}"]
dislikes: ["${d.base.dislikes}"]
skills:
  - 工作: ${document.getElementById('skill-work').value || '[]'}
  - 生活: ${document.getElementById('skill-life').value || '[]'}
  - 爱好: ${document.getElementById('skill-hobby').value || '[]'}
NSFW_information:
  Sex_related traits:
    experiences: "${d.base.sex_exp}"
    sexual_orientation: "${d.base.sex_ori}"
    sexual_role: "${d.base.sex_role}"
    sexual_habits:
${d.lists.habits.map(i => `    - "${i}"`).join('\n')}
  Kinks: "${d.base.kinks}"
  Limits: "${d.base.limits}"`;

        const blob = new Blob([yaml], {type: 'text/yaml'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${d.base.Chinese_name || 'profile'}.yaml`;
        a.click();
    }

    // --- 数据收集 ---
    function collectData() {
        const getV = p => document.querySelector(`[data-path="${p}"]`)?.value || "";
        return {
            base: {
                Chinese_name: getV("char_name.Chinese_name"),
                Nickname: getV("char_name.Nickname"),
                age: getV("char_name.age"), gender: getV("char_name.gender"), height: getV("char_name.height"),
                childhood: getV("background_story.童年"), status: getV("background_story.现状"),
                hair: getV("appearance.hair"), eyes: getV("appearance.eyes"), skin: getV("appearance.skin"),
                face_style: getV("appearance.face_style"), archetype: getV("archetype"),
                angry: getV("emotional_behaviors.angry"), happy: getV("emotional_behaviors.happy"),
                weakness: getV("weakness"), likes: getV("likes"), dislikes: getV("dislikes"),
                sex_exp: getV("NSFW.experiences"), sex_ori: getV("NSFW.orientation"), sex_role: getV("NSFW.role"),
                kinks: getV("NSFW.kinks"), limits: getV("NSFW.limits")
            },
            lists: {
                identity: Array.from(document.querySelectorAll('#list-identity .list-input')).map(i => i.value),
                social_status: Array.from(document.querySelectorAll('#list-social_status .list-input')).map(i => i.value),
                build: Array.from(document.querySelectorAll('#list-build .list-input')).map(i => i.value),
                lifestyle: Array.from(document.querySelectorAll('#list-lifestyle_behaviors .list-input')).map(i => i.value),
                work: Array.from(document.querySelectorAll('#list-work_behaviors .list-input')).map(i => i.value),
                goals: Array.from(document.querySelectorAll('#list-goals .list-input')).map(i => i.value),
                history: Array.from(document.querySelectorAll('#list-history .list-input')).map(i => i.value),
                habits: Array.from(document.querySelectorAll('#list-habits .list-input')).map(i => i.value)
            },
            pairs: {
                core: Array.from(document.querySelectorAll('#list-core_traits .list-row')).map(r => ({k: r.querySelector('.k').value, v: r.querySelector('.v').value})),
                romantic: Array.from(document.querySelectorAll('#list-romantic_traits .list-row')).map(r => ({k: r.querySelector('.k').value, v: r.querySelector('.v').value}))
            },
            rels: Array.from(document.querySelectorAll('#list-relationships .list-row')).map(r => ({n: r.querySelector('.r-n').value, r: r.querySelector('.r-r').value, d: r.querySelector('.r-d').value}))
        };
    }

    // --- 渲染渲染 ---
    function refreshRender() {
        const d = collectData();
        const style = document.getElementById('style-select').value;
        const target = document.getElementById('profile-canvas');
        target.className = style;

        const infoHtml = `
            <div style="padding:40px">
                <h2>${d.base.Chinese_name || 'NO NAME'}</h2>
                <div style="display:flex; gap:20px; margin-bottom:30px">
                    <img src="${avatarBase64}" style="width:200px; height:200px; object-fit:cover; border-radius:10px">
                    <div style="flex:1">
                        <p><b>Age/Gen:</b> ${d.base.age} / ${d.base.gender}</p>
                        <p><b>Identity:</b> ${d.lists.identity.join(', ')}</p>
                        <p><b>Status:</b> ${d.lists.social_status.join(' | ')}</p>
                        <p><b>Skills:</b> Work: ${document.getElementById('skill-work').value}</p>
                    </div>
                </div>
                <hr>
                <h3>Personality</h3>
                <p>${d.pairs.core.map(p => `[${p.k}: ${p.v}]`).join(' ')}</p>
                <h3>Social Relations</h3>
                ${d.rels.map(r => `<div><b>${r.n}</b> (${r.r}): ${r.d}</div>`).join('')}
                <h3>History with User</h3>
                <p>${d.lists.history.join('; ')}</p>
                <h3>Others</h3>
                <p><b>Weakness:</b> ${d.base.weakness}</p>
                <p><b>Likes:</b> ${d.base.likes}</p>
            </div>
        `;

        if (style === 'style-wanted') {
            target.innerHTML = `
                <div class="style-wanted">
                    <p class="header-text">WANTED</p>
                    <div class="avatar-frame"><img src="${avatarBase64}" style="width:100%; height:100%; object-fit:cover"></div>
                    <p class="reward">REWARD: $${(d.base.age || 1) * 10000}</p>
                    <div style="font-size:30px; margin-bottom:20px">DEAD OR ALIVE</div>
                    <div class="content-text">${infoHtml}</div>
                </div>`;
        } else {
            target.innerHTML = `<div class="inner-wrap">${infoHtml}</div>`;
        }
    }

    function downloadPNG() {
        html2canvas(document.getElementById('profile-canvas'), { scale: 2 }).then(canvas => {
            const a = document.createElement('a');
            a.download = 'profile.png';
            a.href = canvas.toDataURL();
            a.click();
        });
    }

    function openImport() { document.getElementById('modal-import').style.display='flex'; }
    function closeImport() { document.getElementById('modal-import').style.display='none'; }

    window.onload = () => { addItem('identity'); refreshRender(); };
</script>
</body>
</html>
