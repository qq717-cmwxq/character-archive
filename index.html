<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色档案创作工具 Pro</title>
    <style>
        :root {
            --m-yellow: #FFF9E3;
            --m-green: #E2F5D6;
            --m-dark-green: #A8D5BA;
            --m-pink: #FFD1DC;
            --m-blue: #D0E9FF;
            --text: #4A4A4A;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--m-yellow);
            color: var(--text);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 布局 */
        header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        main { width: 100%; max-width: 1200px; display: grid; grid-template-columns: 450px 1fr; gap: 20px; }
        
        @media (max-width: 1000px) {
            main { grid-template-columns: 1fr; }
        }

        /* 表单样式 */
        .editor-side {
            background: white; border-radius: 20px; padding: 20px;
            border: 4px solid var(--m-green); height: 90vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group h3 { color: #7BB274; font-size: 1rem; border-left: 4px solid var(--m-dark-green); padding-left: 10px; }
        
        .field { margin-bottom: 10px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; }
        .label-en { font-weight: bold; color: #666; }
        .label-zh { color: #999; }
        
        input, textarea, select {
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box;
        }

        /* 预览区 */
        .preview-side { position: sticky; top: 20px; height: 90vh; display: flex; flex-direction: column; }
        .toolbar { background: white; padding: 10px; border-radius: 15px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        
        #preview-box { flex: 1; overflow-y: auto; background: #fff; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* 风格定义 */
        .content-wrap { padding: 30px; }
        
        /* 1. 档案风 Archive */
        .style-archive { font-family: serif; color: #333; }
        .style-archive h2 { border-bottom: 2px solid #333; text-align: center; }
        .style-archive .section-title { font-weight: bold; background: #eee; padding: 5px; margin: 15px 0 5px 0; border: 1px solid #333; }

        /* 2. 证件风 ID Card */
        .style-id { background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%); }
        .style-id .id-header { display: flex; gap: 20px; align-items: center; border-bottom: 3px solid var(--m-dark-green); padding-bottom: 15px; }
        .style-id .id-avatar { width: 120px; height: 150px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); object-fit: cover; }

        /* 3. 手账风 Journal */
        .style-journal { background-color: #fff; border: 2px dashed var(--m-pink); }
        .style-journal .sticker { background: var(--m-blue); padding: 5px 10px; border-radius: 5px; display: inline-block; transform: rotate(-2deg); margin: 5px; }
        .style-journal h2 { color: var(--m-pink); text-align: center; font-size: 2rem; }

        /* 4. 表格风 Table */
        .style-table table { width: 100%; border-collapse: collapse; }
        .style-table th, .style-table td { border: 1px solid #ddd; padding: 10px; font-size: 13px; }
        .style-table th { background-color: var(--m-green); width: 30%; text-align: left; }

        /* 5. 通缉令 Wanted */
        .style-wanted { 
            background: #e9d5b7; color: #433422; 
            background-image: url('https://www.transparenttextures.com/patterns/paper.png');
            text-align: center;
            border: 15px solid #433422;
        }
        .style-wanted .wanted-header { font-size: 3rem; font-family: 'Impact', fantasy; letter-spacing: 5px; margin: 20px 0; border-bottom: 5px solid #433422; }
        .style-wanted .wanted-avatar { width: 80%; border: 5px solid #433422; filter: sepia(0.5) contrast(1.2); }
        .style-wanted .reward { font-size: 2rem; font-family: serif; font-weight: bold; margin: 20px 0; }

        /* 按钮样式 */
        .btn { padding: 8px 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-green { background: var(--m-green); color: #557A46; }
        .btn-pink { background: var(--m-pink); color: #B36B7C; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 24px; font-weight: bold;">🧸 Character Profile Creator</div>
    <div style="display: flex; gap: 10px;">
        <button class="btn btn-green" onclick="importText()">导入文本</button>
        <button class="btn btn-green" onclick="exportYAML()">导出文本</button>
        <button class="btn btn-pink" onclick="saveData()">保存到本地</button>
        <button class="btn btn-pink" onclick="clearData()">清空</button>
    </div>
</header>

<main>
    <!-- 编辑器区域 -->
    <section class="editor-side" id="editor-form">
        <!-- 基础信息 -->
        <div class="form-group">
            <h3>基础信息 Basic</h3>
            <div class="field">
                <label><span class="label-en">Photo</span> <span class="label-zh">头像上传</span></label>
                <input type="file" id="img-upload" accept="image/*" onchange="loadImg(this)">
            </div>
            <div class="field">
                <label><span class="label-en">Chinese name</span> <span class="label-zh">中文名</span></label>
                <input type="text" data-key="Chinese_name">
            </div>
            <div class="field">
                <label><span class="label-en">Nickname</span> <span class="label-zh">昵称</span></label>
                <input type="text" data-key="Nickname">
            </div>
            <div class="field" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;">
                <input type="text" data-key="age" placeholder="Age">
                <input type="text" data-key="gender" placeholder="Gender">
                <input type="text" data-key="height" placeholder="Height">
            </div>
            <div class="field">
                <label><span class="label-en">identity</span> <span class="label-zh">身份标签</span></label>
                <input type="text" data-key="identity">
            </div>
            <div class="field">
                <label><span class="label-en">social_status</span> <span class="label-zh">社会地位</span></label>
                <input type="text" data-key="social_status">
            </div>
        </div>

        <!-- 背景故事 -->
        <div class="form-group">
            <h3>背景故事 Background Story</h3>
            <textarea data-key="bg_childhood" placeholder="童年 (0-12岁)" rows="2"></textarea>
            <textarea data-key="bg_youth" placeholder="少年 (13-18岁)" rows="2"></textarea>
            <textarea data-key="bg_adult" placeholder="青年 (19-35岁)" rows="2"></textarea>
            <textarea data-key="bg_middle" placeholder="中年 (35岁+)" rows="2"></textarea>
            <textarea data-key="bg_status" placeholder="现状" rows="2"></textarea>
        </div>

        <!-- 外貌与衣着 -->
        <div class="form-group">
            <h3>外貌与衣着 Appearance & Attire</h3>
            <div class="field"><input type="text" data-key="app_hair" placeholder="发型 Hair"></div>
            <div class="field"><input type="text" data-key="app_eyes" placeholder="眼睛 Eyes"></div>
            <div class="field"><input type="text" data-key="app_skin" placeholder="皮肤 Skin"></div>
            <div class="field"><input type="text" data-key="app_face" placeholder="脸型 Face Style"></div>
            <div class="field"><input type="text" data-key="app_build" placeholder="体型 Build"></div>
            <hr>
            <div class="field"><input type="text" data-key="at_formal" placeholder="商务正装 Business Formal"></div>
            <div class="field"><input type="text" data-key="at_casual" placeholder="日常便装 Casual Wear"></div>
            <div class="field"><input type="text" data-key="at_home" placeholder="居家穿着 Home Wear"></div>
        </div>

        <!-- 性格与行为 -->
        <div class="form-group">
            <h3>性格与行为 Personality</h3>
            <div class="field">
                <label><span class="label-en">core_traits</span> <span class="label-zh">核心性格描述</span></label>
                <textarea data-key="core_traits" rows="3"></textarea>
            </div>
            <div class="field">
                <label><span class="label-en">romantic_traits</span> <span class="label-zh">情感中的性格</span></label>
                <textarea data-key="romantic_traits" rows="2"></textarea>
            </div>
            <div class="field">
                <label><span class="label-en">Angry reaction</span> <span class="label-zh">愤怒时的反应</span></label>
                <input type="text" data-key="emo_angry">
            </div>
            <div class="field">
                <label><span class="label-en">Happy reaction</span> <span class="label-zh">开心时的反应</span></label>
                <input type="text" data-key="emo_happy">
            </div>
            <div class="field">
                <label><span class="label-en">lifestyle_behaviors</span> <span class="label-zh">生活习惯</span></label>
                <textarea data-key="life_behavior" rows="2"></textarea>
            </div>
        </div>

        <!-- 偏好与技能 -->
        <div class="form-group">
            <h3>偏好与技能 Goals & Skills</h3>
            <input type="text" data-key="goals" placeholder="目标 Goals" class="field">
            <input type="text" data-key="weakness" placeholder="缺点 Weakness" class="field">
            <input type="text" data-key="likes" placeholder="喜欢 Likes" class="field">
            <input type="text" data-key="dislikes" placeholder="厌恶 Dislikes" class="field">
            <div class="field">
                <label><span class="label-en">Skills (Work / Life / Hobby)</span></label>
                <input type="text" data-key="skill_work" placeholder="工作技能">
                <input type="text" data-key="skill_life" placeholder="生活技能" style="margin-top:5px">
                <input type="text" data-key="skill_hobby" placeholder="爱好技能" style="margin-top:5px">
            </div>
        </div>

        <!-- 人际关系 -->
        <div class="form-group">
            <h3>社交 Social</h3>
            <label><span class="label-en">relationships</span> <span class="label-zh">人际关系 (姓名:关系:描述)</span></label>
            <textarea data-key="relationships" placeholder="张三:挚友:从小一起长大" rows="3"></textarea>
            <label style="margin-top:10px"><span class="label-en">shared_history_with_user</span> <span class="label-zh">与用户的共同经历</span></label>
            <textarea data-key="shared_history" rows="3"></textarea>
        </div>

        <!-- NSFW 信息 -->
        <div class="form-group" style="background: #fff5f5; padding: 10px; border-radius: 10px;">
            <h3>NSFW 信息 (Optional)</h3>
            <input type="text" data-key="sex_exp" placeholder="性经历 Experiences" class="field">
            <input type="text" data-key="sex_ori" placeholder="性取向 Orientation" class="field">
            <input type="text" data-key="sex_role" placeholder="性角色 Role" class="field">
            <textarea data-key="sex_kinks" placeholder="习惯与性癖 Kinks" rows="2"></textarea>
            <input type="text" data-key="sex_limits" placeholder="底线 Limits" class="field">
        </div>
        
        <button class="btn btn-green" style="width:100%; height: 50px; font-size: 18px;" onclick="renderPreview()">生成预览档案 ✨</button>
    </section>

    <!-- 预览区域 -->
    <section class="preview-side">
        <div class="toolbar">
            <span>展示风格：</span>
            <select id="style-select" onchange="renderPreview()">
                <option value="style-archive">经典档案风 Archive</option>
                <option value="style-id">清新证件风 ID Card</option>
                <option value="style-journal">可爱手账风 Journal</option>
                <option value="style-table">详细表格风 Table</option>
                <option value="style-wanted">复古通缉令 Wanted</option>
            </select>
            <button class="btn btn-pink" onclick="window.print()">保存 PDF</button>
        </div>
        <div id="preview-box">
            <div class="content-wrap" id="render-target">
                <p style="text-align:center; color:#ccc; margin-top:100px;">等待生成预览内容...</p>
            </div>
        </div>
    </section>
</main>

<script>
    let avatarBase64 = "";

    function loadImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => avatarBase64 = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    function getVal(key) {
        return document.querySelector(`[data-key="${key}"]`).value || "None";
    }

    function renderPreview() {
        const style = document.getElementById('style-select').value;
        const target = document.getElementById('render-target');
        const box = document.getElementById('preview-box');
        
        box.className = style;

        // 整理数据
        const d = {
            name: getVal('Chinese_name'),
            nick: getVal('Nickname'),
            age: getVal('age'),
            gender: getVal('gender'),
            height: getVal('height'),
            id: getVal('identity'),
            social: getVal('social_status'),
            bg: `童年: ${getVal('bg_childhood')}<br>现状: ${getVal('bg_status')}`,
            app: `${getVal('app_hair')}, ${getVal('app_eyes')}, ${getVal('app_build')}`,
            traits: getVal('core_traits'),
            emo: `Angry: ${getVal('emo_angry')} | Happy: ${getVal('emo_happy')}`,
            skills: `Work: ${getVal('skill_work')} / Hobby: ${getVal('skill_hobby')}`,
            nsfw: `Orientation: ${getVal('sex_ori')} | Kinks: ${getVal('sex_kinks')}`
        };

        if (style === 'style-table') {
            let tableHtml = `<table>`;
            document.querySelectorAll('[data-key]').forEach(el => {
                tableHtml += `<tr><th>${el.getAttribute('data-key')}</th><td>${el.value || '-'}</td></tr>`;
            });
            tableHtml += `</table>`;
            target.innerHTML = tableHtml;
        } 
        else if (style === 'style-wanted') {
            target.innerHTML = `
                <div class="wanted-header">WANTED</div>
                <img src="${avatarBase64}" class="wanted-avatar">
                <div class="reward">REWARD: ${d.id}</div>
                <div style="font-size:1.5rem; font-weight:bold;">DEAD OR ALIVE</div>
                <div style="margin-top:20px; font-family:serif; text-transform:uppercase;">
                    ${d.traits}
                </div>
            `;
        }
        else if (style === 'style-id') {
            target.innerHTML = `
                <div class="id-header">
                    <img src="${avatarBase64}" class="id-avatar">
                    <div>
                        <h2 style="margin:0">${d.name}</h2>
                        <p style="color:#666">${d.id}</p>
                        <p>Age: ${d.age} | Gender: ${d.gender}</p>
                    </div>
                </div>
                <div style="margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13px;">
                    <div><b>Status:</b> ${d.social}</div>
                    <div><b>Height:</b> ${d.height}</div>
                    <div style="grid-column:1/3"><b>Appearance:</b> ${d.app}</div>
                    <div style="grid-column:1/3"><b>Personality:</b> ${d.traits}</div>
                </div>
            `;
        }
        else if (style === 'style-journal') {
            target.innerHTML = `
                <h2>${d.name}</h2>
                <div style="text-align:center"><img src="${avatarBase64}" style="width:150px; border-radius:20px; border:5px solid var(--m-pink);"></div>
                <div style="margin-top:20px;">
                    <div class="sticker">Age: ${d.age}</div>
                    <div class="sticker">Gender: ${d.gender}</div>
                    <div class="sticker">Like: ${getVal('likes')}</div>
                </div>
                <div style="padding:15px; background:var(--m-yellow); border-radius:10px; margin-top:10px;">
                    <b>Story:</b> ${getVal('bg_status')}
                </div>
                <div style="margin-top:10px; font-size:14px;">
                    🍭 <b>Core:</b> ${d.traits}<br>
                    💢 <b>Angry:</b> ${getVal('emo_angry')}
                </div>
            `;
        }
        else { // Archive
            target.innerHTML = `
                <h2>CHARACTER DOSSIER</h2>
                <div style="display:flex; gap:20px;">
                    <img src="${avatarBase64}" style="width:150px; border:1px solid #000;">
                    <div style="flex:1">
                        <div class="section-title">I. BASIC IDENTIFICATION</div>
                        <p>NAME: ${d.name} / NICKNAME: ${d.nick}</p>
                        <p>AGE: ${d.age} / GENDER: ${d.gender} / HEIGHT: ${d.height}</p>
                        <p>IDENTITY: ${d.id} / STATUS: ${d.social}</p>
                    </div>
                </div>
                <div class="section-title">II. BACKGROUND</div>
                <p>${d.bg}</p>
                <div class="section-title">III. BEHAVIOR & SKILLS</div>
                <p><b>Personality:</b> ${d.traits}</p>
                <p><b>Behaviors:</b> ${d.emo}</p>
                <p><b>Skills:</b> ${d.skills}</p>
                <div class="section-title">IV. SOCIAL RELATIONSHIPS</div>
                <p>${getVal('relationships').replace(/\n/g, '<br>')}</p>
            `;
        }
    }

    function exportYAML() {
        let text = "char_name:\n";
        document.querySelectorAll('[data-key]').forEach(el => {
            text += `  ${el.getAttribute('data-key')}: "${el.value.replace(/\n/g, ' ')}"\n`;
        });
        const blob = new Blob([text], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `profile_${getVal('Chinese_name')}.yaml`;
        a.click();
    }

    function importText() {
        const input = prompt("请粘贴档案内容：");
        if (!input) return;
        // 简单匹配逻辑
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (input.includes(key)) {
                const regex = new RegExp(`${key}[:：]\\s*([^\\n]+)`);
                const match = input.match(regex);
                if (match) el.value = match[1].trim();
            }
        });
        renderPreview();
    }

    function saveData() {
        const data = {};
        document.querySelectorAll('[data-key]').forEach(el => {
            data[el.getAttribute('data-key')] = el.value;
        });
        data.avatar = avatarBase64;
        localStorage.setItem('char_save', JSON.stringify(data));
        alert("已保存！");
    }

    function loadData() {
        const saved = localStorage.getItem('char_save');
        if (saved) {
            const data = JSON.parse(saved);
            document.querySelectorAll('[data-key]').forEach(el => {
                el.value = data[el.getAttribute('data-key')] || "";
            });
            avatarBase64 = data.avatar || "";
            renderPreview();
        }
    }

    function clearData() {
        if (confirm("确定清空吗？")) {
            localStorage.removeItem('char_save');
            location.reload();
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
