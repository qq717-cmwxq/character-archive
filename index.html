<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色档案生成工具 - Macaron Style</title>
    <style>
        :root {
            --macaron-yellow: #FFF9E3;
            --macaron-green: #E2F5D6;
            --macaron-dark-green: #A8D5BA;
            --macaron-accent: #FFD1DC;
            --text-color: #5D5D5D;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background-color: var(--macaron-yellow);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部导航与操作栏 */
        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.5rem; color: #7BB274; margin: 0; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }

        .btn-primary { background-color: var(--macaron-green); color: #557A46; }
        .btn-primary:hover { background-color: var(--macaron-dark-green); }
        .btn-accent { background-color: var(--macaron-accent); color: #B36B7C; }
        .btn-accent:hover { filter: brightness(0.9); }

        /* 主容器 */
        main {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 1200px) {
            main { grid-template-columns: 1fr 1fr; max-width: 1400px; }
        }

        /* 表单区域样式 */
        .panel {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 4px solid var(--macaron-green);
        }

        .form-section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--macaron-dark-green);
        }

        .form-section h3 {
            margin-top: 0;
            color: #7BB274;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
        }

        .input-item { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .label-en { color: #888; font-family: monospace; }
        .label-zh { color: #555; margin-left: 5px; }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--macaron-yellow);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fafafa;
        }

        input:focus { outline: none; border-color: var(--macaron-dark-green); background: white; }

        .list-input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        /* 预览区域样式 */
        #preview-container {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .display-card {
            background: white;
            min-height: 600px;
            border-radius: var(--border-radius);
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        /* 风格1：档案风 (Archive) */
        .style-archive {
            border: 1px solid #ddd;
            background-image: radial-gradient(#e5e5f7 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }
        .style-archive h2 { border-bottom: 2px solid #333; }

        /* 风格2：证件风 (ID Card) */
        .style-id {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            border-top: 15px solid #7BB274;
        }
        .style-id .avatar-box { float: left; width: 120px; height: 150px; margin-right: 20px; border: 3px solid white; }

        /* 风格3：手账风 (Journal) */
        .style-journal {
            background-color: #fff;
            border: 2px solid var(--macaron-accent);
            box-shadow: 5px 5px 0px var(--macaron-accent);
        }
        .style-journal::before { content: "❤"; position: absolute; top: 10px; right: 10px; color: var(--macaron-accent); }

        .avatar-preview {
            width: 100px;
            height: 100px;
            background: #eee;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            border: 2px dashed #ccc;
        }

        /* 导入弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            width: 80%;
            max-width: 600px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <h1>🧸 RoleProfile Studio</h1>
    <div class="btn-group">
        <button class="btn-primary" onclick="openImport()">导入内容</button>
        <button class="btn-primary" onclick="exportYAML()">导出英文文本</button>
        <button class="btn-accent" onclick="saveToLocal()">本地保存</button>
        <button class="btn-accent" onclick="clearData()">清空</button>
    </div>
</header>

<main>
    <!-- 左侧：填写表单 -->
    <section class="panel" id="form-container">
        <!-- 基础信息 -->
        <div class="form-section">
            <h3>基础信息 Basic Info</h3>
            <div class="input-item">
                <label><span class="label-en">Photo</span> <span class="label-zh">角色配图</span></label>
                <input type="file" id="avatar-input" accept="image/*" onchange="handleImage(this)">
                <img id="avatar-img" class="avatar-preview" title="点击上传图片">
            </div>
            <div class="input-item">
                <label><span class="label-en">Chinese name</span> <span class="label-zh">中文名</span></label>
                <input type="text" data-key="Chinese_name">
            </div>
            <div class="input-item">
                <label><span class="label-en">Nickname</span> <span class="label-zh">昵称</span></label>
                <input type="text" data-key="Nickname">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="input-item" style="flex:1">
                    <label><span class="label-en">age</span> <span class="label-zh">年龄</span></label>
                    <input type="text" data-key="age">
                </div>
                <div class="input-item" style="flex:1">
                    <label><span class="label-en">gender</span> <span class="label-zh">性别</span></label>
                    <input type="text" data-key="gender">
                </div>
                <div class="input-item" style="flex:1">
                    <label><span class="label-en">height</span> <span class="label-zh">身高</span></label>
                    <input type="text" data-key="height">
                </div>
            </div>
            <div class="input-item">
                <label><span class="label-en">identity</span> <span class="label-zh">身份/职业标签 (逗号分隔)</span></label>
                <input type="text" data-key="identity" placeholder="例如: 剑客, 流浪者">
            </div>
        </div>

        <!-- 背景故事 -->
        <div class="form-section">
            <h3>背景故事 Background Story</h3>
            <div class="input-item">
                <label><span class="label-en">Childhood(0-12)</span> <span class="label-zh">童年经历</span></label>
                <textarea data-key="bg_childhood" rows="2"></textarea>
            </div>
            <div class="input-item">
                <label><span class="label-en">Youth(13-18)</span> <span class="label-zh">少年经历</span></label>
                <textarea data-key="bg_youth" rows="2"></textarea>
            </div>
            <div class="input-item">
                <label><span class="label-en">Young Adult(19-35)</span> <span class="label-zh">青年经历</span></label>
                <textarea data-key="bg_adult" rows="2"></textarea>
            </div>
            <div class="input-item">
                <label><span class="label-en">Status</span> <span class="label-zh">现状</span></label>
                <textarea data-key="bg_status" rows="2"></textarea>
            </div>
        </div>

        <!-- 外貌特征 -->
        <div class="form-section">
            <h3>外貌特征 Appearance</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-item">
                    <label><span class="label-en">hair</span> <span class="label-zh">发型</span></label>
                    <input type="text" data-key="hair">
                </div>
                <div class="input-item">
                    <label><span class="label-en">eyes</span> <span class="label-zh">眼睛</span></label>
                    <input type="text" data-key="eyes">
                </div>
                <div class="input-item">
                    <label><span class="label-en">skin</span> <span class="label-zh">皮肤</span></label>
                    <input type="text" data-key="skin">
                </div>
                <div class="input-item">
                    <label><span class="label-en">build</span> <span class="label-zh">身材/体型</span></label>
                    <input type="text" data-key="build">
                </div>
            </div>
        </div>

        <!-- 性格与行为 -->
        <div class="form-section">
            <h3>性格行为 Personality</h3>
            <div class="input-item">
                <label><span class="label-en">core_traits</span> <span class="label-zh">核心性格(用逗号或分号)</span></label>
                <textarea data-key="core_traits" placeholder="冷静: 遇事不慌; 勇敢: 敢于挑战"></textarea>
            </div>
            <div class="input-item">
                <label><span class="label-en">lifestyle_behaviors</span> <span class="label-zh">生活习惯</span></label>
                <textarea data-key="lifestyle_behaviors" placeholder="一行一个习惯"></textarea>
            </div>
        </div>

        <!-- 技能 -->
        <div class="form-section">
            <h3>技能 Skills</h3>
            <div class="input-item">
                <label><span class="label-en">Work</span> <span class="label-zh">工作技能</span></label>
                <input type="text" data-key="skill_work">
            </div>
            <div class="input-item">
                <label><span class="label-en">Life</span> <span class="label-zh">生活技能</span></label>
                <input type="text" data-key="skill_life">
            </div>
        </div>

        <!-- NSFW 信息 (可选) -->
        <div class="form-section">
            <h3>NSFW 信息 (Optional)</h3>
            <div class="input-item">
                <label><span class="label-en">Kinks</span> <span class="label-zh">性癖好</span></label>
                <input type="text" data-key="nsfw_kinks">
            </div>
        </div>

        <button class="btn-primary" style="width:100%; margin-top: 10px;" onclick="renderPreview()">生成档案预览 ✨</button>
    </section>

    <!-- 右侧：效果展示 -->
    <section id="preview-container">
        <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
            <span>展示风格：</span>
            <select id="style-select" onchange="changeStyle()" style="width: 150px;">
                <option value="style-archive">经典档案风</option>
                <option value="style-id">清新证件风</option>
                <option value="style-journal">可爱手账风</option>
            </select>
            <button class="btn-accent" onclick="window.print()">保存为PDF/打印</button>
        </div>

        <div id="capture-area" class="display-card style-archive">
            <div id="preview-content">
                <div style="text-align: center; color: #ccc; margin-top: 100px;">
                    <p>填写左侧内容后点击“生成档案预览”</p>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- 导入弹窗 -->
<div id="importModal" class="modal">
    <div class="modal-content">
        <h3>导入已有档案内容</h3>
        <p style="font-size: 0.8rem; color: #666;">请粘贴角色描述（系统将尝试自动匹配字段）：</p>
        <textarea id="import-area" rows="15" style="margin-bottom: 15px;"></textarea>
        <div class="btn-group">
            <button class="btn-primary" onclick="processImport()">确认解析</button>
            <button onclick="closeImport()">取消</button>
        </div>
    </div>
</div>

<script>
    // 数据模型映射
    let charData = {
        avatar: "",
        Chinese_name: "",
        Nickname: "",
        age: "",
        gender: "",
        height: "",
        identity: "",
        bg_childhood: "",
        bg_youth: "",
        bg_adult: "",
        bg_status: "",
        hair: "",
        eyes: "",
        skin: "",
        build: "",
        core_traits: "",
        lifestyle_behaviors: "",
        skill_work: "",
        skill_life: "",
        nsfw_kinks: ""
    };

    // 处理图片上传
    function handleImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                charData.avatar = e.target.result;
                document.getElementById('avatar-img').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 收集表单数据
    function collectData() {
        const inputs = document.querySelectorAll('[data-key]');
        inputs.forEach(input => {
            charData[input.getAttribute('data-key')] = input.value;
        });
    }

    // 渲染预览
    function renderPreview() {
        collectData();
        const content = document.getElementById('preview-content');
        
        let html = `
            <div class="avatar-box" style="text-align:center; margin-bottom:20px;">
                <img src="${charData.avatar || ''}" style="max-width:150px; border-radius:10px; border:3px solid var(--macaron-green);">
                <h2 style="margin:10px 0 5px 0;">${charData.Chinese_name || 'Unset Name'}</h2>
                <p style="color:#888; font-family:monospace;">${charData.Nickname || 'No Nickname'}</p>
            </div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div>
                    <h4 style="border-left:4px solid var(--macaron-green); padding-left:8px;">Basic Status</h4>
                    <p><b>Age:</b> ${charData.age}</p>
                    <p><b>Gender:</b> ${charData.gender}</p>
                    <p><b>Height:</b> ${charData.height}</p>
                    <p><b>Identity:</b> ${charData.identity}</p>
                </div>
                <div>
                    <h4 style="border-left:4px solid var(--macaron-green); padding-left:8px;">Appearance</h4>
                    <p><b>Hair:</b> ${charData.hair}</p>
                    <p><b>Eyes:</b> ${charData.eyes}</p>
                    <p><b>Build:</b> ${charData.build}</p>
                </div>
            </div>

            <h4 style="border-left:4px solid var(--macaron-green); padding-left:8px; margin-top:20px;">Background Story</h4>
            <div style="font-size:0.9rem; line-height:1.6;">
                <p><b>Youth:</b> ${charData.bg_youth}</p>
                <p><b>Current Status:</b> ${charData.bg_status}</p>
            </div>

            <h4 style="border-left:4px solid var(--macaron-green); padding-left:8px; margin-top:20px;">Personality & Traits</h4>
            <p>${charData.core_traits}</p>

            <h4 style="border-left:4px solid var(--macaron-green); padding-left:8px; margin-top:20px;">Skills</h4>
            <p><b>Work:</b> ${charData.skill_work}</p>
            <p><b>Life:</b> ${charData.skill_life}</p>
        `;
        
        content.innerHTML = html;
    }

    // 风格切换
    function changeStyle() {
        const style = document.getElementById('style-select').value;
        const area = document.getElementById('capture-area');
        area.className = 'display-card ' + style;
    }

    // 导出纯英文 YAML 格式文本
    function exportYAML() {
        collectData();
        let yaml = `char_name:
  Chinese name: ${charData.Chinese_name}
  Nickname: ${charData.Nickname}
  age: ${charData.age}
  gender: ${charData.gender}
  height: ${charData.height}
  identity:
    - ${charData.identity.split(',').join('\n    - ')}
  background_story:
    童年(0-12岁): ${charData.bg_childhood}
    少年(13-18岁): ${charData.bg_youth}
    现状: ${charData.bg_status}
  appearance:
    hair: ${charData.hair}
    eyes: ${charData.eyes}
    build: ${charData.build}
  personality:
    core_traits: 
      - ${charData.core_traits.split(';').join('\n      - ')}
  skills:
    - 工作: [${charData.skill_work}]
    - 生活: [${charData.skill_life}]
  NSFW_information:
    Kinks: ${charData.nsfw_kinks}`;

        const blob = new Blob([yaml], {type: 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${charData.Chinese_name || 'character'}_profile.txt`;
        a.click();
    }

    // 导入解析
    function openImport() { document.getElementById('importModal').style.display = 'flex'; }
    function closeImport() { document.getElementById('importModal').style.display = 'none'; }

    function processImport() {
        const text = document.getElementById('import-area').value;
        // 简易正则匹配
        const patterns = {
            Chinese_name: /(?:中文名|name)[:：]\s*(.*)/i,
            age: /(?:年龄|age)[:：]\s*(.*)/i,
            gender: /(?:性别|gender)[:：]\s*(.*)/i,
            height: /(?:身高|height)[:：]\s*(.*)/i,
            hair: /(?:发型|hair)[:：]\s*(.*)/i,
            identity: /(?:身份|identity)[:：]\s*(.*)/i
        };

        for (let key in patterns) {
            const match = text.match(patterns[key]);
            if (match) {
                const el = document.querySelector(`[data-key="${key}"]`);
                if (el) el.value = match[1].trim();
            }
        }
        
        alert("解析完成，部分字段已填入。如有复杂结构请手动调整。");
        closeImport();
    }

    // 本地存储
    function saveToLocal() {
        collectData();
        localStorage.setItem('saved_char_data', JSON.stringify(charData));
        alert("已保存到浏览器本地！");
    }

    function loadLocal() {
        const saved = localStorage.getItem('saved_char_data');
        if (saved) {
            charData = JSON.parse(saved);
            const inputs = document.querySelectorAll('[data-key]');
            inputs.forEach(input => {
                const val = charData[input.getAttribute('data-key')];
                if (val) input.value = val;
            });
            if (charData.avatar) document.getElementById('avatar-img').src = charData.avatar;
            renderPreview();
        }
    }

    function clearData() {
        if(confirm("确定要清空所有内容吗？")) {
            localStorage.removeItem('saved_char_data');
            location.reload();
        }
    }

    // 初始化加载
    window.onload = loadLocal;
</script>

</body>
  </html>
